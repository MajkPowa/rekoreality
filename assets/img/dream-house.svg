<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="Dům připravený k prodeji">
  <defs>
    <linearGradient id="dC1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efece5"/>
      <stop offset="0.55" stop-color="#dbd6cc"/>
      <stop offset="1" stop-color="#c4beb1"/>
    </linearGradient>
    <linearGradient id="dC2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbc5b9"/>
      <stop offset="1" stop-color="#aea79a"/>
    </linearGradient>
    <linearGradient id="dG" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#54707f"/>
      <stop offset="0.5" stop-color="#2c3f4b"/>
      <stop offset="1" stop-color="#1b2932"/>
    </linearGradient>
    <linearGradient id="dW" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9955c"/>
      <stop offset="1" stop-color="#96632c"/>
    </linearGradient>
    <radialGradient id="dWarm" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#ffd79b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffbe6d" stop-opacity="0.1"/>
    </radialGradient>
    <filter id="dBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- stín -->
  <ellipse cx="450" cy="556" rx="360" ry="42" fill="#5a6b7a" opacity="0.28" filter="url(#dBlur)"/>

  <!-- spodní hmota -->
  <rect x="150" y="330" width="600" height="220" fill="url(#dC1)"/>
  <path d="M750 330 L818 356 L818 550 L750 550 Z" fill="url(#dC2)"/>

  <!-- prosklení -->
  <rect x="188" y="356" width="380" height="176" fill="url(#dG)"/>
  <rect x="188" y="356" width="380" height="176" fill="url(#dWarm)" opacity="0.4"/>
  <g fill="#eae6de" opacity="0.85">
    <rect x="264" y="356" width="5" height="176"/>
    <rect x="340" y="356" width="5" height="176"/>
    <rect x="416" y="356" width="5" height="176"/>
    <rect x="492" y="356" width="5" height="176"/>
  </g>
  <path d="M208 532 L306 356 L354 356 L256 532 Z" fill="#fff" opacity="0.14"/>

  <!-- dřevěný obklad -->
  <rect x="580" y="330" width="164" height="220" fill="url(#dW)"/>
  <g fill="#6c4519" opacity="0.3">
    <rect x="596" y="330" width="3" height="220"/><rect x="622" y="330" width="3" height="220"/>
    <rect x="648" y="330" width="3" height="220"/><rect x="674" y="330" width="3" height="220"/>
    <rect x="700" y="330" width="3" height="220"/><rect x="726" y="330" width="3" height="220"/>
  </g>
  <rect x="628" y="392" width="70" height="158" fill="#27343d"/>
  <rect x="628" y="392" width="70" height="158" fill="url(#dWarm)" opacity="0.25"/>

  <!-- horní převislá hmota -->
  <rect x="112" y="168" width="666" height="166" fill="url(#dC1)"/>
  <rect x="112" y="168" width="666" height="14" fill="#f4f1ea" opacity="0.8"/>
  <rect x="150" y="330" width="600" height="12" fill="#807a6f" opacity="0.35"/>

  <!-- lamely -->
  <rect x="416" y="196" width="322" height="120" fill="#31404a"/>
  <g fill="#101b21" opacity="0.55">
    <rect x="416" y="196" width="322" height="6"/><rect x="416" y="217" width="322" height="6"/>
    <rect x="416" y="238" width="322" height="6"/><rect x="416" y="259" width="322" height="6"/>
    <rect x="416" y="280" width="322" height="6"/><rect x="416" y="301" width="322" height="6"/>
  </g>

  <!-- okna patra -->
  <rect x="150" y="204" width="228" height="108" fill="url(#dG)"/>
  <rect x="150" y="204" width="228" height="108" fill="url(#dWarm)" opacity="0.28"/>
  <rect x="262" y="204" width="5" height="108" fill="#eae6de" opacity="0.85"/>
  <path d="M166 312 L246 204 L286 204 L206 312 Z" fill="#fff" opacity="0.13"/>

  <!-- terasa -->
  <path d="M136 550 L800 550 L860 604 L86 604 Z" fill="#e2ded4"/>
  <g stroke="#bdb7ab" stroke-width="2" opacity="0.55">
    <line x1="280" y1="550" x2="248" y2="604"/>
    <line x1="440" y1="550" x2="434" y2="604"/>
    <line x1="600" y1="550" x2="620" y2="604"/>
  </g>

  <!-- zeleň -->
  <g>
    <ellipse cx="92" cy="486" rx="62" ry="78" fill="#3d6248" opacity="0.9"/>
    <ellipse cx="838" cy="470" rx="58" ry="82" fill="#3d6248" opacity="0.9"/>
    <ellipse cx="60" cy="530" rx="46" ry="42" fill="#2c4a35" opacity="0.85"/>
    <ellipse cx="866" cy="524" rx="42" ry="38" fill="#2c4a35" opacity="0.85"/>
  </g>
</svg>
