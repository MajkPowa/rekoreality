    <path d="M400 96 L648 246 L152 246 Z" fill="url(#p1r)"/>
    <path d="M400 116 L620 250 L180 250 Z" fill="#4a4f57"/>
    <rect x="176" y="240" width="448" height="14" fill="#2f333a"/>
    <!-- stěny -->
    <rect x="196" y="252" width="408" height="164" fill="url(#p1w)"/>
