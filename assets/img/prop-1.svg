<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Rodinný dům se sedlovou střechou">
  <defs>
    <linearGradient id="p1sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d3ee"/><stop offset="1" stop-color="#e4f0f6"/>
    </linearGradient>
    <linearGradient id="p1w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#ddd6c8"/>
    </linearGradient>
    <linearGradient id="p1r" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c6068"/><stop offset="1" stop-color="#3b3f46"/>
