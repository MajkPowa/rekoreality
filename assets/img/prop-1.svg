  </defs>
  <rect width="800" height="520" fill="url(#p1sky)"/>
  <ellipse cx="640" cy="70" rx="150" ry="46" fill="#fff" opacity="0.5"/>
  <ellipse cx="180" cy="104" rx="120" ry="34" fill="#fff" opacity="0.42"/>

