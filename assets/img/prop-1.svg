      <rect x="628" y="272" width="3" height="144"/><rect x="654" y="272" width="3" height="144"/>
    </g>
    <path d="M560 272 L678 272 L678 262 L560 262 Z" fill="#3b3f46"/>
    <!-- okna -->
    <g>
      <rect x="228" y="288" width="92" height="76" fill="url(#p1g)"/>
      <rect x="270" y="288" width="4" height="76" fill="#fff" opacity="0.75"/>
      <rect x="228" y="322" width="92" height="4" fill="#fff" opacity="0.75"/>
      <rect x="358" y="288" width="132" height="76" fill="url(#p1g)"/>
      <rect x="422" y="288" width="4" height="76" fill="#fff" opacity="0.75"/>
