<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Moderní vila s bazénem po rekonstrukci">
  <defs>
    <linearGradient id="p2sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fc0e6"/><stop offset="1" stop-color="#dceef5"/>
    </linearGradient>
    <linearGradient id="p2c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efece4"/><stop offset="1" stop-color="#cec8bb"/>
    </linearGradient>
    <linearGradient id="p2g" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#587380"/><stop offset="1" stop-color="#1e2c35"/>
    </linearGradient>
    <linearGradient id="p2wd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cd9a5e"/><stop offset="1" stop-color="#96652f"/>
    </linearGradient>
    <linearGradient id="p2pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9e2ee"/><stop offset="1" stop-color="#63b6d6"/>
    </linearGradient>
    <radialGradient id="p2warm" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#ffd79b" stop-opacity="0.85"/><stop offset="1" stop-color="#ffbe6d" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  <rect width="800" height="520" fill="url(#p2sky)"/>
  <ellipse cx="200" cy="70" rx="160" ry="40" fill="#fff" opacity="0.45"/>

  <!-- kopce -->
  <path d="M0 300 C 140 268 250 296 380 288 C 520 280 640 300 800 286 L800 380 L0 380 Z" fill="#94b6a4" opacity="0.6"/>
  <g fill="#4e7358" opacity="0.8">
    <ellipse cx="70" cy="286" rx="76" ry="56"/>
    <ellipse cx="748" cy="272" rx="82" ry="62"/>
  </g>

  <path d="M0 350 C 220 336 420 352 620 344 C 700 341 760 348 800 344 L800 520 L0 520 Z" fill="#8fae74"/>

  <!-- dům -->
  <g>
    <ellipse cx="410" cy="392" rx="300" ry="26" fill="#3e4c3a" opacity="0.25"/>
    <!-- přízemí -->
    <rect x="150" y="238" width="520" height="152" fill="url(#p2c)"/>
    <path d="M670 238 L722 258 L722 390 L670 390 Z" fill="#bcb6a8"/>
    <!-- sklo -->
    <rect x="180" y="258" width="330" height="120" fill="url(#p2g)"/>
    <rect x="180" y="258" width="330" height="120" fill="url(#p2warm)" opacity="0.4"/>
    <g fill="#eae6de" opacity="0.85">
      <rect x="246" y="258" width="4" height="120"/><rect x="312" y="258" width="4" height="120"/>
      <rect x="378" y="258" width="4" height="120"/><rect x="444" y="258" width="4" height="120"/>
    </g>
    <path d="M196 378 L272 258 L306 258 L230 378 Z" fill="#fff" opacity="0.15"/>
    <!-- dřevo -->
    <rect x="524" y="238" width="140" height="152" fill="url(#p2wd)"/>
    <g fill="#6c4519" opacity="0.3">
      <rect x="540" y="238" width="3" height="152"/><rect x="566" y="238" width="3" height="152"/>
      <rect x="592" y="238" width="3" height="152"/><rect x="618" y="238" width="3" height="152"/>
      <rect x="644" y="238" width="3" height="152"/>
    </g>
    <!-- patro -->
    <rect x="120" y="128" width="560" height="112" fill="url(#p2c)"/>
    <rect x="120" y="128" width="560" height="10" fill="#f6f3ec" opacity="0.8"/>
    <rect x="150" y="238" width="520" height="9" fill="#7f796d" opacity="0.35"/>
    <rect x="380" y="150" width="270" height="78" fill="#31404a"/>
    <g fill="#111c22" opacity="0.5">
      <rect x="380" y="150" width="270" height="5"/><rect x="380" y="168" width="270" height="5"/>
      <rect x="380" y="186" width="270" height="5"/><rect x="380" y="204" width="270" height="5"/>
    </g>
    <rect x="150" y="154" width="190" height="72" fill="url(#p2g)"/>
    <rect x="150" y="154" width="190" height="72" fill="url(#p2warm)" opacity="0.25"/>
    <rect x="244" y="154" width="4" height="72" fill="#eae6de" opacity="0.85"/>
  </g>

  <!-- terasa a bazén -->
  <path d="M130 390 L700 390 L744 434 L84 434 Z" fill="#e6e2d8"/>
  <path d="M110 440 L720 440 L768 520 L54 520 Z" fill="url(#p2pool)"/>
  <g stroke="#fff" opacity="0.5" stroke-linecap="round">
    <line x1="180" y1="462" x2="420" y2="462" stroke-width="4"/>
    <line x1="300" y1="488" x2="640" y2="488" stroke-width="5"/>
    <line x1="150" y1="504" x2="330" y2="504" stroke-width="3"/>
  </g>
  <g opacity="0.2">
    <rect x="180" y="444" width="330" height="26" fill="#23323b"/>
    <rect x="524" y="444" width="140" height="26" fill="#96652f"/>
  </g>

  <!-- lehátka -->
  <g fill="#f6f3ec">
    <rect x="596" y="398" width="66" height="10" rx="5"/>
    <rect x="600" y="386" width="24" height="14" rx="5" transform="rotate(-22 612 393)"/>
  </g>
</svg>
